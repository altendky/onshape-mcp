[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/altendky/onshape-mcp"
homepage = "https://github.com/altendky/onshape-mcp"
description = "A Rust-based MCP (Model Context Protocol) server for Onshape integration"
keywords = ["mcp", "onshape", "cad", "modelcontextprotocol"]
categories = ["development-tools", "api-bindings"]

[workspace.dependencies]
# Internal crates
onshape-mcp-core = { path = "crates/onshape-mcp-core", version = "0.1.0" }
onshape-mcp-io = { path = "crates/onshape-mcp-io", version = "0.1.0" }

# External dependencies
chrono = { version = "0.4", default-features = false, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
figment = { version = "0.10", features = ["toml", "env"] }
rmcp = "0.14"
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
