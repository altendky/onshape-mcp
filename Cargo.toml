[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/altendky/onshape-mcp"
homepage = "https://github.com/altendky/onshape-mcp"
description = "A Rust-based MCP (Model Context Protocol) server for Onshape integration"
keywords = ["mcp", "onshape", "cad", "modelcontextprotocol"]
categories = ["development-tools", "api-bindings"]

[workspace.dependencies]
# Internal crates
onshape-client-core = { path = "crates/onshape-client-core", version = "0.1.0" }
onshape-client-io = { path = "crates/onshape-client-io", version = "0.1.0" }
onshape-mcp-core = { path = "crates/onshape-mcp-core", version = "0.1.0" }
onshape-mcp-io = { path = "crates/onshape-mcp-io", version = "0.1.0" }
onshape-mcp-resources = { path = "crates/onshape-mcp-resources", version = "0.1.0" }

# External dependencies
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
figment = { version = "0.10", features = ["toml", "env"] }
notify = "8"
oauth2 = { version = "5", default-features = false }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = "0.16"
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
pulldown-cmark = "0.13"
tempfile = "3"
toml = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
