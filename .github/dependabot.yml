# Dependency monitoring configuration
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  # npm wrapper package
  - package-ecosystem: "npm"
    directory: "/npm/onshape-mcp"
    schedule:
      interval: "daily"
