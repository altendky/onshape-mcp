name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  auto-review:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request focusing on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Use inline comments for specific code issues.

            After reviewing, submit a formal review:
            - `gh pr review --approve -b "reason"` if the PR looks good
            - `gh pr review --request-changes -b "reason"` if changes are needed
            - `gh pr review --comment -b "feedback"` for neutral feedback

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
