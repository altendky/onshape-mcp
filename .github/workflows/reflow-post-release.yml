name: Post-release PR

on:
  workflow_call:
  workflow_dispatch:

jobs:
  post-release:
    name: Post-release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Read version
        id: version
        run: |
          version=$(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '
                  .packages[]
                  | select(.name == "onshape-mcp")
                  | .version
                '
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if post-release needed
        id: check
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == *-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $version is a pre-release — skipping post-release"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create post-release PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          branch="post-release/${tag}"

          # Compute next patch dev version (e.g., 0.5.0 -> 0.5.1-dev.0)
          IFS='.' read -r major minor patch <<< "$version"
          next_patch=$((patch + 1))
          dev_version="${major}.${minor}.${next_patch}-dev.0"

          # Delete existing post-release branch if present (auto-closes any open PR)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" &>/dev/null; then
            echo "::notice::Deleting existing branch $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi

          # Resolve bot identity
          bot_user_id=$(gh api '/users/altendky-release[bot]' --jq '.id')
          if [[ -z "$bot_user_id" ]]; then
            echo "::error::Failed to resolve bot user ID for altendky-release[bot]"
            exit 1
          fi
          bot_email="${bot_user_id}+altendky-release[bot]@users.noreply.github.com"

          # Update workspace version in root Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${dev_version}\"/" Cargo.toml

          # Propagate to all workspace deps, Cargo.lock, npm packages
          node scripts/sync-versions.js

          # Get current HEAD
          base_sha=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base_sha" --jq '.tree.sha')

          # Create blobs and tree entries for all modified files
          tree_entries="[]"
          while IFS= read -r file; do
            blob_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" \
              -f content="$(base64 -w0 < "$file")" \
              -f encoding=base64 \
              --jq '.sha')
            tree_entries=$(echo "$tree_entries" | jq \
              --arg path "$file" \
              --arg sha "$blob_sha" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]')
          done < <(git diff --name-only)

          # Create tree
          tree_sha=$(jq -n \
            --arg base "$base_tree" \
            --argjson tree "$tree_entries" \
            '{base_tree: $base, tree: $tree}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')

          # Create commit (GitHub signs this via the App installation token)
          commit_sha=$(jq -n \
            --arg msg "Start ${dev_version} development" \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            --arg name "altendky-release[bot]" \
            --arg email "$bot_email" \
            '{
              message: $msg,
              tree: $tree,
              parents: [$parent],
              author: {name: $name, email: $email},
              committer: {name: $name, email: $email}
            }' | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')

          # Verify the commit is signed
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" --jq '.verification.verified')
          if [[ "$verified" != "true" ]]; then
            echo "::error::Commit $commit_sha is not verified — aborting"
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" --jq '.verification'
            exit 1
          fi

          # Create branch
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$commit_sha"

          # Create PR
          gh pr create \
            --head "$branch" \
            --title "Post-release: start ${dev_version}" \
            --body "Automated post-release version bump after v${version}." \
            --label enqueue
