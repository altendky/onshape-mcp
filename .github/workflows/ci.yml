name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    uses: ./.github/workflows/reflow-pre-commit.yml

  rust:
    name: Rust
    uses: ./.github/workflows/reflow-rust.yml

  coverage:
    name: Coverage
    uses: ./.github/workflows/reflow-coverage.yml
    permissions:
      id-token: write

  npm:
    name: npm
    uses: ./.github/workflows/reflow-npm.yml
    permissions:
      id-token: write

  release-staging:
    name: Release Staging
    uses: ./.github/workflows/reflow-release-staging.yml

  all:
    name: all
    if: always()
    needs: [pre-commit, rust, coverage, npm, release-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
