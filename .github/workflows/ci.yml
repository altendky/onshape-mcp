name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  mise:
    name: Mise
    uses: ./.github/workflows/reflow-mise.yml

  pre-commit:
    name: Pre-commit
    uses: ./.github/workflows/reflow-pre-commit.yml

  rust:
    name: Rust
    uses: ./.github/workflows/reflow-rust.yml
    secrets: inherit

  coverage:
    name: Coverage
    uses: ./.github/workflows/reflow-coverage.yml
    permissions:
      id-token: write

  npm:
    name: npm
    uses: ./.github/workflows/reflow-npm.yml
    permissions:
      id-token: write

  version:
    name: Version
    uses: ./.github/workflows/reflow-release-version.yml
    with:
      git-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build:
    name: Build
    uses: ./.github/workflows/reflow-release-build.yml

  error-enums:
    name: Error enums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: python scripts/generate-error-enums.py --check

  checks:
    name: checks
    if: ${{ !cancelled() }}
    needs: [mise, pre-commit, rust, coverage, npm, error-enums]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  tag-release:
    name: Tag release
    if: github.ref == 'refs/heads/main'
    needs: [checks]
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/reflow-tag-release.yml
    secrets: inherit

  post-release:
    name: Post-release PR
    if: github.ref == 'refs/heads/main' && needs.tag-release.outputs.tagged == 'true'
    needs: [tag-release]
    uses: ./.github/workflows/reflow-post-release.yml
    secrets: inherit

  release-config:
    name: Release config
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.config.outputs.publish }}
      npm-version: ${{ steps.config.outputs.npm-version }}
      npm-dist-tag: ${{ steps.config.outputs.npm-dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure release pipeline
        id: config
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            {
              echo "publish=true"
              echo "npm-version=$VERSION"
              echo "npm-dist-tag=latest"
            } >> "$GITHUB_OUTPUT"
            echo "Mode: publish (tag push)"
          else
            staging=$(.github/scripts/compute-staging-version.sh \
              "$VERSION" "$REF_NAME" "$SHA" "$RUN_ID")
            {
              echo "publish=false"
              echo "npm-version=$staging"
              echo "npm-dist-tag=staging"
            } >> "$GITHUB_OUTPUT"
            echo "Mode: validate (staging)"
            echo "Staging version: $staging"
          fi

  release-npm:
    name: Release npm
    needs: [release-config, version, build, checks]
    uses: ./.github/workflows/reflow-release-npm.yml
    permissions:
      id-token: write
    secrets: inherit
    with:
      version: ${{ needs.release-config.outputs.npm-version }}
      binary-version: ${{ needs.version.outputs.version }}
      dist-tag: ${{ needs.release-config.outputs.npm-dist-tag }}
      publish: ${{ needs.release-config.outputs.publish == 'true' }}

  cargo-publish:
    name: Publish crates
    needs: [release-config, checks]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Validate crate packaging
        run: cargo package --workspace

      - name: Authenticate with crates.io
        if: needs.release-config.outputs.publish == 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish all workspace crates
        if: needs.release-config.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: .github/scripts/cargo-publish-workspace.sh

  publish-release:
    name: GitHub Release
    needs: [release-config, version, build, release-npm, cargo-publish]
    uses: ./.github/workflows/reflow-publish-release.yml
    permissions:
      contents: write
    with:
      publish: ${{ needs.release-config.outputs.publish == 'true' }}
      version: ${{ needs.version.outputs.version }}

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [checks, tag-release, post-release, release-npm, cargo-publish, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: tag-release, post-release
          jobs: ${{ toJSON(needs) }}
