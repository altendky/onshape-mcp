name: npm

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  coverage:
    name: ☂️ ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} npm ${{ matrix.os.name }} ${{ matrix.arch.name }}
    needs: library
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude.windows-arm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Install dependencies
        run: npm ci
        working-directory: npm/onshape-mcp

      - name: Generate coverage
        run: npm run test:coverage
        working-directory: npm/onshape-mcp

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          use_oidc: true
          files: npm/onshape-mcp/coverage/lcov.info
          flags: npm
          fail_ci_if_error: true
