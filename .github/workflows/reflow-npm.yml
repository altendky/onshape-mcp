name: npm

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  coverage:
    name: ☂️ ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} npm ${{ matrix.os.name }} ${{ matrix.arch.name }}
    needs: library
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude.windows-arm }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Install dependencies
        run: npm ci
        working-directory: npm/onshape-mcp

      - name: Generate coverage
        run: npm run test:coverage
        working-directory: npm/onshape-mcp

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          # Workaround for Codecov action Keybase GPG key import failure:
          # https://github.com/codecov/codecov-action/issues/1955#issuecomment-4640001038
          use_pypi: true
          use_oidc: true
          files: npm/onshape-mcp/coverage/lcov.info
          flags: npm
          fail_ci_if_error: true
