name: npm

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  coverage:
    name: ☂️ ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} npm ${{ matrix.os.name }} ${{ matrix.arch.name }}
    needs: library
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude.windows-arm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Install dependencies
        run: npm ci
        working-directory: npm/onshape-mcp

      - name: Generate coverage
        run: npm run test:coverage
        working-directory: npm/onshape-mcp

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: true
          files: npm/onshape-mcp/coverage/lcov.info
          flags: npm
          fail_ci_if_error: true
