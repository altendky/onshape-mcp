name: Release Staging

on:
  workflow_call:
    inputs:
      git-tag:
        description: "Git tag (e.g., v0.2.0) — if provided, version is verified against Cargo.toml"
        type: string
        default: ""
      dry-run:
        description: "Skip npm publish (run full build/test pipeline only)"
        type: boolean
        default: false
      skip-cleanup:
        description: "Preserve staging packages on npm for manual inspection"
        type: boolean
        default: false

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  verify:
    name: Verify
    needs: [library]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      staging-version: ${{ steps.staging-version.outputs.staging-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --manifest-path crates/onshape-mcp/Cargo.toml \
            | jq -r '.packages[] | select(.name == "onshape-mcp") | .version')
          if [[ -z "$version" ]]; then
            echo "ERROR: Could not extract version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

      - name: Verify tag matches Cargo.toml version
        if: inputs.git-tag != ''
        shell: bash
        env:
          GIT_TAG: ${{ inputs.git-tag }}
        run: |
          tag="$GIT_TAG"
          tag_version="${tag#v}"
          cargo_version="${{ steps.version.outputs.version }}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "ERROR: Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)" >&2
            exit 1
          fi
          echo "Tag version matches Cargo.toml: $cargo_version"

      - name: Check npm version sync
        run: node scripts/sync-npm-versions.js --check

      - name: Compute staging version
        id: staging-version
        shell: bash
        run: |
          staging_version=$(.github/scripts/compute-staging-version.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}")
          echo "staging-version=$staging_version" >> "$GITHUB_OUTPUT"
          echo "Staging version: $staging_version"

      # cargo package is deferred to Phase 3 — workspace dependency crates
      # (onshape-mcp-core, etc.) must exist on crates.io before cargo package
      # can resolve them, even with --no-verify.

  build:
    name: "Build (${{ matrix.platform.name }})"
    needs: [library]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.library.outputs.matrix).release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.platform.rust-target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.rust-target }}

      - name: Verify static linking (Linux)
        if: contains(matrix.platform.rust-target, 'linux-musl')
        shell: bash
        run: |
          binary="target/${{ matrix.platform.rust-target }}/release/${{ matrix.platform.binary-name }}"
          echo "Checking: $binary"
          file "$binary"
          if file "$binary" | grep -qE 'statically linked|static-pie linked'; then
            echo "OK: Binary is statically linked"
          else
            echo "ERROR: Binary is dynamically linked" >&2
            exit 1
          fi

      - name: Smoke test binary
        shell: bash
        run: |
          binary="target/${{ matrix.platform.rust-target }}/release/${{ matrix.platform.binary-name }}"
          echo "Running: $binary --version"
          "$binary" --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.platform.npm-platform }}
          path: target/${{ matrix.platform.rust-target }}/release/${{ matrix.platform.binary-name }}
          retention-days: 3

  package-npm:
    name: Package npm
    needs: [library, verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: binaries

      - name: Copy binaries into npm platform packages
        shell: bash
        run: |
          platforms='${{ toJSON(fromJSON(needs.library.outputs.matrix).release) }}'
          echo "$platforms" | jq -c '.[]' | while read -r entry; do
            npm_platform=$(echo "$entry" | jq -r '.["npm-platform"]')
            binary_name=$(echo "$entry" | jq -r '.["binary-name"]')

            src="binaries/binary-${npm_platform}/${binary_name}"
            dst="npm/${npm_platform}/bin/${binary_name}"

            echo "Copying $src -> $dst"
            mkdir -p "npm/${npm_platform}/bin"
            cp "$src" "$dst"
            chmod +x "$dst"
          done

      - name: Compute platform directories
        id: platform-dirs
        shell: bash
        run: |
          platforms='${{ toJSON(fromJSON(needs.library.outputs.matrix).release) }}'
          dirs=$(echo "$platforms" | jq -r '.[]."npm-platform"' | sed 's|^|npm/|' | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Platform directories: $dirs"

      - name: Pack npm tarballs (real version)
        shell: bash
        run: |
          mkdir -p dist/release-tarballs

          # Pack platform packages first
          for dir in ${{ steps.platform-dirs.outputs.dirs }}; do
            echo "Packing $dir (release)..."
            tarball=$(npm pack "./$dir" --pack-destination dist/release-tarballs 2>&1 | tail -1)
            echo "  -> $tarball"
          done

          # Pack main package
          echo "Packing npm/onshape-mcp (release)..."
          tarball=$(npm pack ./npm/onshape-mcp --pack-destination dist/release-tarballs 2>&1 | tail -1)
          echo "  -> $tarball"

          echo "Release tarballs:"
          ls -la dist/release-tarballs/

      - name: Update package.json files to staging version
        shell: bash
        run: |
          staging_version="${{ needs.verify.outputs.staging-version }}"
          echo "Updating all package.json to staging version: $staging_version"

          for pkg_dir in npm/onshape-mcp ${{ steps.platform-dirs.outputs.dirs }}; do
            pkg_json="$pkg_dir/package.json"
            echo "Updating $pkg_json to $staging_version"
            # Update version field
            jq --arg v "$staging_version" '.version = $v' "$pkg_json" > tmp.json && mv tmp.json "$pkg_json"
            # Update optionalDependencies versions if present
            if jq -e '.optionalDependencies' "$pkg_json" > /dev/null 2>&1; then
              jq --arg v "$staging_version" '.optionalDependencies |= with_entries(if .key | startswith("@onshape-mcp/") then .value = $v else . end)' "$pkg_json" > tmp.json && mv tmp.json "$pkg_json"
            fi
          done

      - name: Pack npm tarballs (staging version)
        shell: bash
        run: |
          mkdir -p dist/staging-tarballs

          # Pack platform packages first
          for dir in ${{ steps.platform-dirs.outputs.dirs }}; do
            echo "Packing $dir (staging)..."
            tarball=$(npm pack "./$dir" --pack-destination dist/staging-tarballs 2>&1 | tail -1)
            echo "  -> $tarball"
          done

          # Pack main package
          echo "Packing npm/onshape-mcp (staging)..."
          tarball=$(npm pack ./npm/onshape-mcp --pack-destination dist/staging-tarballs 2>&1 | tail -1)
          echo "  -> $tarball"

          echo "Staging tarballs:"
          ls -la dist/staging-tarballs/

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist/checksums
          truncate -s 0 dist/checksums/SHA256SUMS

          for f in dist/release-tarballs/* dist/staging-tarballs/* binaries/binary-*/*; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            name=$(basename "$f")
            echo "$hash  $name" >> dist/checksums/SHA256SUMS
          done

          echo "SHA256SUMS:"
          cat dist/checksums/SHA256SUMS

      - name: Upload release tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-release-tarballs
          path: dist/release-tarballs/
          retention-days: 3

      - name: Upload staging tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-staging-tarballs
          path: dist/staging-tarballs/
          retention-days: 3

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v6
        with:
          name: sha256sums
          path: dist/checksums/SHA256SUMS
          retention-days: 3

  test-npm-tarballs:
    name: "Test npm tarballs (${{ matrix.platform.name }})"
    needs: [library, verify, package-npm]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.library.outputs.matrix).release }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download staging tarballs
        uses: actions/download-artifact@v7
        with:
          name: npm-staging-tarballs
          path: staging-tarballs

      - name: List tarballs
        shell: bash
        run: ls -la staging-tarballs/

      - name: Install from tarballs
        shell: bash
        run: |
          mkdir test-install
          cd test-install
          npm init -y

          # Install platform packages first, then main package
          # Find the platform tarball for this runner
          npm_platform="${{ matrix.platform.npm-platform }}"

          # Install the platform tarball for this platform
          platform_tarball=$(ls ../staging-tarballs/onshape-mcp-${npm_platform}-*)
          echo "Installing platform tarball: $platform_tarball"
          npm install "$platform_tarball"

          # Install the main package tarball
          main_tarball=$(ls ../staging-tarballs/onshape-mcp-[0-9]*)
          echo "Installing main tarball: $main_tarball"
          npm install "$main_tarball"

      - name: Verify binary version
        shell: bash
        run: |
          cd test-install
          version="${{ needs.verify.outputs.version }}"
          output=$(npx onshape-mcp --version 2>&1)
          echo "Binary output: $output"
          if echo "$output" | grep -q "$version"; then
            echo "OK: Version matches ($version)"
          else
            echo "ERROR: Expected version $version in output: $output" >&2
            exit 1
          fi

  publish-npm-staging:
    name: Publish npm staging
    needs: [library, verify, package-npm, test-npm-tarballs]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Check npm publish credentials
        id: check-auth
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm CLI >= 11.5.1 auto-detects OIDC via ACTIONS_ID_TOKEN_REQUEST_URL.
          # When called from release.yml (id-token: write), OIDC is used.
          # When called from ci.yml (no id-token), NPM_TOKEN is used as fallback.
          has_oidc="false"
          has_token="false"

          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "OIDC available (id-token: write granted by caller)"
            has_oidc="true"
          fi

          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN available"
            has_token="true"
          fi

          if [[ "$has_oidc" == "false" && "$has_token" == "false" ]]; then
            echo "No npm credentials available (fork PR?) — skipping publish"
            echo "can-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "can-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-auth.outputs.can-publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download staging tarballs
        if: steps.check-auth.outputs.can-publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: npm-staging-tarballs
          path: staging-tarballs

      - name: Publish platform packages
        if: steps.check-auth.outputs.can-publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          platforms='${{ toJSON(fromJSON(needs.library.outputs.matrix).release) }}'
          echo "$platforms" | jq -c '.[]' | while read -r entry; do
            npm_platform=$(echo "$entry" | jq -r '.["npm-platform"]')
            shopt -s failglob
            tarballs=( ./staging-tarballs/onshape-mcp-"${npm_platform}"-* )
            if [[ ${#tarballs[@]} -ne 1 ]]; then
              echo "ERROR: Expected exactly 1 tarball for ${npm_platform}, found ${#tarballs[@]}" >&2
              exit 1
            fi
            echo "Publishing ${tarballs[0]}..."
            npm publish "${tarballs[0]}" --tag staging --access public
          done

      - name: Publish main package
        if: steps.check-auth.outputs.can-publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s failglob
          tarballs=( ./staging-tarballs/onshape-mcp-[0-9]* )
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 main tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          echo "Publishing ${tarballs[0]}..."
          npm publish "${tarballs[0]}" --tag staging --access public

    outputs:
      can-publish: ${{ steps.check-auth.outputs.can-publish }}

  test-npm-published:
    name: "Test npm published (${{ matrix.platform.name }})"
    needs: [library, verify, publish-npm-staging]
    if: ${{ needs.publish-npm-staging.outputs.can-publish == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.library.outputs.matrix).release }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install from registry
        shell: bash
        run: |
          staging_version="${{ needs.verify.outputs.staging-version }}"
          npm_platform="${{ matrix.platform.npm-platform }}"
          mkdir test-registry-install
          cd test-registry-install
          npm init -y

          # Retry with exponential backoff to allow for npm registry propagation.
          # After npm install succeeds we also verify the platform binary exists
          # because platform packages are optionalDependencies — npm install can
          # succeed even if the platform-specific package hasn't propagated yet.
          bin_name="onshape-mcp"
          if [[ "$npm_platform" == win32-* ]]; then
            bin_name="onshape-mcp.exe"
          fi
          expected_bin="node_modules/@onshape-mcp/${npm_platform}/bin/${bin_name}"

          max_attempts=5
          delay=10
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt ${attempt}/${max_attempts}: installing onshape-mcp@${staging_version}..."
            if npm install "onshape-mcp@${staging_version}" && [[ -f "$expected_bin" ]]; then
              echo "Install succeeded and platform binary exists: ${expected_bin}"
              break
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "ERROR: Install failed after ${max_attempts} attempts" >&2
              if [[ ! -f "$expected_bin" ]]; then
                echo "Platform binary not found: ${expected_bin}" >&2
              fi
              exit 1
            fi
            echo "Retrying in ${delay}s..."
            rm -rf node_modules package-lock.json
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Verify binary version
        shell: bash
        run: |
          cd test-registry-install
          version="${{ needs.verify.outputs.version }}"
          output=$(npx onshape-mcp --version 2>&1)
          echo "Binary output: $output"
          if echo "$output" | grep -q "$version"; then
            echo "OK: Version matches ($version)"
          else
            echo "ERROR: Expected version $version in output: $output" >&2
            exit 1
          fi
