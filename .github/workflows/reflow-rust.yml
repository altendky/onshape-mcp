name: Rust

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  resolve-versions:
    name: Resolve Rust versions
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.resolve.outputs.msrv }}
      stable: ${{ steps.resolve.outputs.stable }}
      beta: ${{ steps.resolve.outputs.beta }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: resolve
        uses: ./.github/actions/resolve-rust-versions
        with:
          msrv: "1.88"

  # Lint job runs separately (doesn't need build/test split)
  lint:
    name: Lint
    needs: [library, resolve-versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-versions.outputs.stable }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check

  # Build job: builds and archives tests
  # Linux builds use Alpine containers for musl linking
  build:
    name: 🔨 ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} ${{ matrix.rust.emoji }} ${{ matrix.os.name }} ${{ matrix.arch.name }} ${{ matrix.rust.name }}
    needs: [library, resolve-versions]
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    continue-on-error: ${{ matrix.rust.matrix == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        rust: ${{ fromJSON(needs.library.outputs.matrix).axes.rust }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude }}
    steps:
      - uses: actions/checkout@v4

      # Determine the Rust version to use
      - name: Determine Rust version
        id: rust-version
        shell: bash
        run: |
          case "${{ matrix.rust.matrix }}" in
            msrv) echo "version=${{ needs.resolve-versions.outputs.msrv }}" >> "$GITHUB_OUTPUT" ;;
            stable) echo "version=${{ needs.resolve-versions.outputs.stable }}" >> "$GITHUB_OUTPUT" ;;
            beta) echo "version=${{ needs.resolve-versions.outputs.beta }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Linux: Run build in Alpine container for musl linking
      - name: Build in Alpine container (Linux)
        if: matrix.os.matrix == 'linux'
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: |
            -c "
            set -ex

            # Install dependencies
            apk add --no-cache curl bash gcc musl-dev

            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ steps.rust-version.outputs.version }}
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"

            # Install nextest
            curl -LsSf https://get.nexte.st/latest/linux-musl | tar zxf - -C /usr/local/bin

            # Build and archive tests
            cargo nextest archive --all-features --archive-file target/nextest-archive.tar.zst

            # Verify static linking
            echo 'Checking for statically linked binaries...'
            for bin in target/debug/deps/* target/release/deps/*; do
              if [ -f \"\$bin\" ] && [ -x \"\$bin\" ]; then
                if file \"\$bin\" | grep -q 'ELF.*executable'; then
                  if ldd \"\$bin\" 2>&1 | grep -q 'not a dynamic executable\\|statically linked'; then
                    echo \"OK: \$bin is statically linked\"
                  else
                    echo \"INFO: \$bin linking:\"
                    ldd \"\$bin\" 2>&1 || true
                  fi
                fi
              fi
            done
            "

      # Non-Linux: Native build
      - name: Install Rust toolchain (non-Linux)
        if: matrix.os.matrix != 'linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Install cargo-nextest (non-Linux)
        if: matrix.os.matrix != 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build and archive tests (non-Linux)
        if: matrix.os.matrix != 'linux'
        run: cargo nextest archive --all-features --archive-file target/nextest-archive.tar.zst

      # Upload artifact
      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}-${{ matrix.rust.matrix }}
          path: target/nextest-archive.tar.zst
          retention-days: 1

  # Test job: runs archived tests in different environments
  # Linux tests run in both glibc (Ubuntu) and musl (Alpine) environments
  test:
    name: 🧪 ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} ${{ matrix.rust.emoji }} ${{ matrix.libc.emoji }} ${{ matrix.os.name }} ${{ matrix.arch.name }} ${{ matrix.rust.name }} ${{ matrix.libc.name }}
    needs: [library, resolve-versions, build]
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    continue-on-error: ${{ matrix.rust.matrix == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        rust: ${{ fromJSON(needs.library.outputs.matrix).axes.rust }}
        libc: ${{ fromJSON(needs.library.outputs.matrix).axes.libc }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude }}
    steps:
      - uses: actions/checkout@v4

      # Download the test archive
      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}-${{ matrix.rust.matrix }}

      # Test in Alpine container (musl)
      - name: Run tests in Alpine (musl)
        if: matrix.libc.matrix == 'musl'
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: |
            -c "
            set -ex
            apk add --no-cache curl bash tar gzip

            # Install nextest
            curl -LsSf https://get.nexte.st/latest/linux-musl | tar zxf - -C /usr/local/bin

            # Run tests from archive
            cargo-nextest nextest run --archive-file nextest-archive.tar.zst --workspace-remap .
            "

      # Test on native runner (glibc for Linux, native for macOS/Windows)
      - name: Install cargo-nextest (glibc/native)
        if: matrix.libc.matrix != 'musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (glibc/native)
        if: matrix.libc.matrix != 'musl'
        run: cargo-nextest nextest run --archive-file nextest-archive.tar.zst --workspace-remap .
