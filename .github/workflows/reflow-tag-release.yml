name: Tag release

on:
  workflow_call:
    outputs:
      tagged:
        description: Whether a new tag was created
        value: ${{ jobs.tag-release.outputs.tagged }}

jobs:
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.check.outputs.skip != 'true' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check if release commit
        id: check
        run: |
          version=$(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '
                  .packages[]
                  | select(.name == "onshape-mcp")
                  | .version
                '
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $version is a pre-release — skipping"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${version} already exists — skipping"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          node scripts/release-changelog.js extract "$VERSION" > /dev/null
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
