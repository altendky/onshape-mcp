name: Tag release

on:
  workflow_call:

jobs:
  tag-release:
    name: Tag & post-release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check if release commit
        id: check
        run: |
          version=$(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '
                  .packages[]
                  | select(.name == "onshape-mcp")
                  | .version
                '
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $version is a pre-release — skipping"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${version} already exists — skipping"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check.outputs.skip != 'true'
        run: |
          version="${{ steps.check.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      - if: steps.check.outputs.skip != 'true'
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Create post-release PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${{ steps.check.outputs.version }}"

          # Compute next patch dev version (e.g., 0.5.0 -> 0.5.1-dev.0)
          IFS='.' read -r major minor patch <<< "$version"
          next_patch=$((patch + 1))
          dev_version="${major}.${minor}.${next_patch}-dev.0"

          # Configure git identity
          git config user.name "altendky-release[bot]"
          git config user.email "${{ vars.RELEASE_APP_ID }}+altendky-release[bot]@users.noreply.github.com"

          git checkout -b "post-release/v${version}"

          # Update workspace version in root Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${dev_version}\"/" Cargo.toml

          # Propagate to all workspace deps, Cargo.lock, npm packages
          node scripts/sync-versions.js

          git add -A
          git commit -m "Start ${dev_version} development"
          git push -u origin "post-release/v${version}"

          gh pr create \
            --title "Post-release: start ${dev_version}" \
            --body "Automated post-release version bump after v${version}." \
            --label enqueue
