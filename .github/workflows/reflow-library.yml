name: Library

on:
  workflow_call:
    outputs:
      matrix:
        description: Matrix configuration as JSON
        value: ${{ jobs.generate.outputs.matrix }}

jobs:
  generate:
    name: Generate library
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.library.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load library
        id: library
        uses: ./.github/actions/library
