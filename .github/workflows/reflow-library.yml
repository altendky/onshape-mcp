name: Library

on:
  workflow_call:
    outputs:
      matrix:
        description: Matrix configuration as JSON
        value: ${{ jobs.generate.outputs.matrix }}

jobs:
  generate:
    name: Generate library
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.library.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Load library
        id: library
        uses: ./.github/actions/library
