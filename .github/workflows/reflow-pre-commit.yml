name: Pre-commit

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  check:
    name: 🔶 ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} ${{ matrix.os.name }} ${{ matrix.arch.name }}
    needs: library
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude.windows-arm }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock') }}

      # Workaround: mise's aqua backend downloads pre-commit as a .pyz
      # (Python zipapp) without any extension on Windows. The py launcher
      # handles .pyz natively, so give the file its proper extension.
      - name: Fix pre-commit binary name on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "PATHEXT: $env:PATHEXT"
          $dir = mise where pre-commit
          $src = Join-Path $dir "pre-commit"
          $dst = Join-Path $dir "pre-commit.pyz"
          if ((Test-Path $src) -and !(Test-Path $dst)) {
            Copy-Item $src $dst
          }

      - run: pre-commit run --show-diff-on-failure --color=always --all-files
