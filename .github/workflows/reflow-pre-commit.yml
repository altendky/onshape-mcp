name: Pre-commit

on:
  workflow_call:

jobs:
  library:
    name: Generate library
    uses: ./.github/workflows/reflow-library.yml

  check:
    name: 🔶 ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} ${{ matrix.os.name }} ${{ matrix.arch.name }}
    needs: library
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.library.outputs.matrix).axes.os }}
        arch: ${{ fromJSON(needs.library.outputs.matrix).axes.arch }}
        exclude: ${{ fromJSON(needs.library.outputs.matrix).exclude.windows-arm }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock') }}

      - name: Mise diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          MISE_VERBOSE: 1
        run: |
          echo "=== mise bin-paths ==="
          mise bin-paths
          echo "=== pre-commit install dir contents ==="
          $dir = mise where pre-commit
          echo "Install dir: $dir"
          Get-ChildItem -Recurse $dir
          echo "=== where.exe pre-commit ==="
          where.exe pre-commit
          echo "=== mise ls ==="
          mise ls --json

      - env:
          MISE_VERBOSE: 1
        run: pre-commit run --show-diff-on-failure --color=always --all-files
