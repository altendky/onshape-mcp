name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Skip npm publish (run full build/test pipeline only)"
        type: boolean
        default: false
      skip-cleanup:
        description: "Preserve staging packages on npm for manual inspection"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    uses: ./.github/workflows/reflow-release-staging.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      git-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      dry-run: ${{ inputs.dry-run || false }}
      skip-cleanup: ${{ inputs.skip-cleanup || false }}
