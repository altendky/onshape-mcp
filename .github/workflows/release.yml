name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Read version
        id: version
        run: |
          version=$(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '
                  .packages[]
                  | select(.name == "onshape-mcp")
                  | .version
                '
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $version is a pre-release — skipping"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing tag
        if: steps.version.outputs.release == 'true'
        id: tag
        run: |
          version="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${version} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.release == 'true' && steps.tag.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      - name: Configure Git identity
        if: steps.version.outputs.release == 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_slug="${{ steps.app-token.outputs.app-slug }}"
          user_id=$(gh api "/users/${app_slug}[bot]" --jq '.id')
          git config user.name "${app_slug}[bot]"
          git config user.email "${user_id}+${app_slug}[bot]@users.noreply.github.com"

      - name: Create post-release PR
        if: steps.version.outputs.release == 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${{ steps.version.outputs.version }}"

          # Compute next patch dev version (e.g., 0.5.0 -> 0.5.1-dev.0)
          IFS='.' read -r major minor patch <<< "$version"
          next_patch=$((patch + 1))
          dev_version="${major}.${minor}.${next_patch}-dev.0"

          git checkout -b "post-release/v${version}"

          # Update workspace version in root Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${dev_version}\"/" Cargo.toml

          # Propagate to all workspace deps, Cargo.lock, npm packages
          node scripts/sync-versions.js

          git add -A
          git commit -m "Start ${dev_version} development"
          git push -u origin "post-release/v${version}"

          gh pr create \
            --title "Post-release: start ${dev_version}" \
            --body "Automated post-release version bump after v${version}." \
            --label enqueue
