name: Cleanup npm staging

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: cleanup-npm-staging
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup staging packages
    runs-on: ubuntu-latest
    steps:
      - name: Check for NPM_TOKEN
        id: check-token
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN not available — skipping cleanup"
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-token.outputs.has-token == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        if: steps.check-token.outputs.has-token == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Unpublish stale staging versions
        if: steps.check-token.outputs.has-token == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Max age: 2 days = 48 hours = 172800 seconds.
          # npm allows unpublish within 72 hours of publishing. In the worst
          # case we miss 3 consecutive 6-hour cron runs (18 hours) before
          # detecting a stale version, so 48 + 18 = 66 hours — still safely
          # under the 72-hour deadline with 6 hours of margin.
          MAX_AGE_SECONDS=172800
          now=$(date +%s)

          # Derive platform packages from the release matrix in library.yml
          packages=("onshape-mcp" "@onshape-mcp/opencode-auth")
          while IFS= read -r platform; do
            packages+=("@onshape-mcp/${platform}")
          done < <(yq -r '.release[].npm-platform' .github/actions/library/library.yml)

          # Collect stale versions into temp files, grouped by package.
          for pkg in "${packages[@]}"; do
            echo "Checking $pkg for staging versions..."

            # Get all versions with their publish times
            # npm view returns JSON with time object containing version -> timestamp mappings
            times_json=$(npm view "$pkg" time --json 2>/dev/null || echo "{}")

            if [[ "$times_json" == "{}" ]]; then
              echo "  No versions found (package may not exist yet)"
              continue
            fi

            # Extract staging versions and check age
            echo "$times_json" | jq -r 'to_entries[] | select(.key | test("-staging-")) | "\(.key) \(.value)"' | while read -r version timestamp; do
              publish_epoch=$(date -d "$timestamp" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "$timestamp" +%s 2>/dev/null || echo "")
              if [[ -z "$publish_epoch" ]]; then
                echo "  WARN: Could not parse timestamp for $version ($timestamp) — skipping"
                continue
              fi
              age=$((now - publish_epoch))

              if [[ $age -gt $MAX_AGE_SECONDS ]]; then
                age_hours=$((age / 3600))
                echo "  STALE: $version (${age_hours}h old)"
                echo "$version" >> "/tmp/stale-${pkg//\//-}"
              else
                age_hours=$((age / 3600))
                echo "  OK: $version (${age_hours}h old)"
              fi
            done
          done

          # Unpublish main package first (reverse of publish order)
          unpublished=0
          for pkg in "${packages[@]}"; do
            stale_file="/tmp/stale-${pkg//\//-}"
            if [[ ! -f "$stale_file" ]]; then
              continue
            fi

            while read -r version; do
              echo "Unpublishing ${pkg}@${version}..."
              if npm unpublish "${pkg}@${version}" 2>&1; then
                echo "  OK"
                unpublished=$((unpublished + 1))
              else
                echo "  FAILED (may already be unpublished or past 72h deadline)"
              fi
            done < "$stale_file"
          done

          echo "Cleanup complete: unpublished $unpublished package versions"
