axes:
  os:
    - name: Linux
      matrix: linux
      emoji: 🐧
      runs-on:
        arm: ubuntu-24.04-arm
        intel: ubuntu-latest
    - name: macOS
      matrix: macos
      emoji: 🍎
      runs-on:
        arm: macos-latest
        intel: macos-15-intel
    - name: Windows
      matrix: windows
      emoji: 🪟
      runs-on:
        arm: windows-11-arm
        intel: windows-latest
  arch:
    - name: ARM
      matrix: arm
      emoji: 💪
    - name: Intel
      matrix: intel
      emoji: 🌀
  rust:
    - name: MSRV
      matrix: msrv
      version: "1.88"
      emoji: ⏬
    - name: stable
      matrix: stable
      version: stable
      emoji: 🪨
    - name: beta
      matrix: beta
      version: beta
      emoji: 🔮
  libc:
    - name: native
      matrix: native
      emoji: 🏠
      # No container - runs directly on runner
    - name: glibc
      matrix: glibc
      emoji: 🐃
      # Runs on Ubuntu runner (glibc-based), no container needed
    - name: musl
      matrix: musl
      emoji: 🦌
      container: alpine:latest

exclude:
  # Windows ARM runners not available
  - os:
      matrix: windows
    arch:
      matrix: arm

  # macOS only uses native (no glibc/musl concept)
  - os:
      matrix: macos
    libc:
      matrix: glibc
  - os:
      matrix: macos
    libc:
      matrix: musl

  # Windows only uses native (no glibc/musl concept)
  - os:
      matrix: windows
    libc:
      matrix: glibc
  - os:
      matrix: windows
    libc:
      matrix: musl

  # Linux excludes native (uses glibc + musl for testing)
  - os:
      matrix: linux
    libc:
      matrix: native
