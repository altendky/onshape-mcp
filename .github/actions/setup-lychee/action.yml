name: Setup lychee
description: Install lychee link checker for the current platform

inputs:
  version:
    description: "Lychee version to install (e.g., 'v0.18.0' or 'latest')"
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    # Install Rust toolchain (only needed for macOS Intel which has no pre-built lychee)
    - name: Install Rust
      if: runner.os == 'macOS' && runner.arch == 'X64'
      uses: dtolnay/rust-toolchain@stable

    # Cache cargo registry for macOS Intel builds
    - name: Cache cargo
      if: runner.os == 'macOS' && runner.arch == 'X64'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/lychee
        key: cargo-lychee-${{ runner.os }}-${{ runner.arch }}

    - name: Install lychee
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Determine version
        if [[ "${INPUT_VERSION}" == "latest" ]]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/lycheeverse/lychee/releases/latest | jq -r '.tag_name')
        else
          VERSION="${INPUT_VERSION}"
        fi
        echo "Installing lychee ${VERSION}"

        BASE_URL="https://github.com/lycheeverse/lychee/releases/download/${VERSION}"

        # Map runner.os and runner.arch to asset name
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)
            ASSET="lychee-x86_64-unknown-linux-gnu.tar.gz"
            ;;
          Linux-ARM64)
            ASSET="lychee-aarch64-unknown-linux-gnu.tar.gz"
            ;;
          macOS-ARM64)
            ASSET="lychee-arm64-macos.tar.gz"
            ;;
          Windows-X64)
            ASSET="lychee-x86_64-windows.exe"
            ;;
          macOS-X64)
            # No pre-built binary available - check cache or build from source
            if command -v lychee &>/dev/null; then
              echo "lychee found in cache"
              lychee --version
              exit 0
            fi
            echo "Building lychee from source (no pre-built macOS Intel binary)..."
            cargo install lychee
            lychee --version
            exit 0
            ;;
          *)
            echo "::error::Unsupported platform: ${{ runner.os }}-${{ runner.arch }}"
            exit 1
            ;;
        esac

        echo "Downloading ${ASSET}..."
        curl -fsSL "${BASE_URL}/${ASSET}" -o "${ASSET}"

        # Install to ~/.local/bin
        mkdir -p "$HOME/.local/bin"

        if [[ "$ASSET" == *.exe ]]; then
          mv "${ASSET}" "$HOME/.local/bin/lychee.exe"
        else
          tar -xzf "${ASSET}"
          mv lychee "$HOME/.local/bin/"
        fi

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        # Verify installation
        "$HOME/.local/bin/lychee" --version || "$HOME/.local/bin/lychee.exe" --version
