name: Setup Rust
description: Install Rust toolchain

inputs:
  toolchain:
    description: Rust toolchain version to install
    required: true
  components:
    description: Comma-separated list of components to install (e.g., "rustfmt, clippy")
    required: false
    default: ""
  cache-key:
    description: Additional key to distinguish caches for jobs with the same ID
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        cache-key: ${{ inputs.cache-key }}
