name: Setup Nextest
description: Install cargo-nextest, works in both containers and bare runners

inputs:
  use-musl:
    description: Use musl installation method (for Alpine containers)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Method 1: Use musl installation (for Alpine containers)
    - name: Install cargo-nextest (musl)
      if: inputs.use-musl == 'true'
      shell: sh
      run: |
        set -ex

        ARCH=$(uname -m)
        case "$ARCH" in
        x86_64)
          # Use prebuilt musl binary for x86_64
          curl -LsSf "https://get.nexte.st/latest/linux-musl" | tar zxf - -C /usr/local/bin
          ;;
        aarch64)
          # No prebuilt musl binary for ARM, and glibc binary doesn't work with gcompat
          # (__res_init symbol missing). Build from source instead.
          # Pin to 0.9.114 for MSRV 1.88 compatibility (0.9.115+ requires 1.89)
          # See: https://github.com/altendky/onshape-mcp/issues/45

          # Install build dependencies if not present
          if ! command -v gcc >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          fi

          # Install Rust if not present (minimal profile for faster install)
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi

          cargo install cargo-nextest --locked --version 0.9.114
          ;;
        *)
          echo "Unsupported architecture: $ARCH" && exit 1
          ;;
        esac

    # Method 2: Use taiki-e/install-action (for bare runners)
    - name: Install cargo-nextest
      if: inputs.use-musl != 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
