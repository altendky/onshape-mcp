[settings]
# Disable GitHub attestation verification and increase HTTP timeout to eliminate
# flaky CI failures (especially on Windows runners). mise.lock already pins
# SHA256 checksums for integrity. This also affects local dev — a trade-off for
# simplicity over CI-only env vars. See #247.
github_attestations = false
http_timeout = "120s"
locked = true

[tools]
node = "24"
python = "3"
"pipx:pre-commit" = "4.5.1"
# Non-core tools: use explicit backend prefix (aqua:/github:) for Renovate compatibility
"aqua:taiki-e/cargo-llvm-cov" = "0.8.5"
"aqua:EmbarkStudios/cargo-deny" = "0.19.0"
"github:nextest-rs/nextest" = { version = "0.9.132", version_prefix = "cargo-nextest-" }
# Provides cargo-binstall so the cargo backend can download pre-built binaries
# instead of compiling from source.
cargo-binstall = "latest"
# lychee uses the cargo backend with binstall support so that pre-built binaries
# are downloaded where available (Linux, Windows x64, macOS ARM64), and source
# compilation is used as a fallback on platforms without pre-built binaries
# (macOS Intel). The lychee project dropped macOS Intel binaries after v0.15.1
# (April 2024), so the aqua backend cannot cover all CI platforms.
"cargo:lychee" = "0.23.0"
"npm:wrangler" = "4.77.0"
"aqua:superfly/flyctl" = "0.4.27"

[vars]
all_platforms = "linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-x64,macos-arm64,windows-x64"

[tasks.lock-tool]
description = "Install runtime deps and lock a tool for all platforms"
usage = 'arg "<tool>" help="Tool to lock (e.g., node, npm:wrangler)"'
run = [
  "mise install --yes node python",
  "mise lock --yes --platform {{vars.all_platforms}} -- ${usage_tool?}"
]
