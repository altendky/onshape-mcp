[settings]
# Disable GitHub attestation verification and increase HTTP timeout to eliminate
# flaky CI failures (especially on Windows runners). mise.lock already pins
# SHA256 checksums for integrity. This also affects local dev — a trade-off for
# simplicity over CI-only env vars. See #247.
github_attestations = false
http_timeout = "120s"
locked = true

[tools]
node = "24"
python = "3.14.5"
"pipx:pre-commit" = "4.6.1"
# Non-core tools: use explicit backend prefix (aqua:/github:) for Renovate compatibility
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:nextest-rs/nextest" = { version = "0.9.140", version_prefix = "cargo-nextest-" }
# Provides cargo-binstall so the cargo backend can download pre-built binaries
# instead of compiling from source.
cargo-binstall = "latest"
# lychee uses the cargo backend with binstall support so that pre-built binaries
# are downloaded where available (Linux, Windows x64, macOS ARM64), and source
# compilation is used as a fallback on platforms without pre-built binaries
# (macOS Intel). The lychee project dropped macOS Intel binaries after v0.15.1
# (April 2024), so the aqua backend cannot cover all CI platforms.
"cargo:lychee" = "0.24.2"
"cargo:mdbook" = "0.5.3"
"npm:wrangler" = "4.119.0"
"aqua:superfly/flyctl" = "0.4.76"

[vars]
all_platforms = "linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-x64,macos-arm64,windows-x64"

[tasks.lock-tool]
description = "Install runtime deps and lock a tool for all platforms"
usage = 'arg "<tool>" help="Tool to lock (e.g., node, npm:wrangler)"'
run = [
  "mise install --yes node python",
  "mise lock --yes --platform {{vars.all_platforms}} -- ${usage_tool?}"
]

[tasks.release]
description = "Create a release-prep PR for the given version"
usage = 'arg "<version>" help="Target release version (e.g., 0.5.0)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="${usage_version?}"

# Validate: semver release format (X.Y.Z, no pre-release suffix)
if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "Error: version must be in X.Y.Z format (got: $version)" >&2
  exit 1
fi

# Ensure clean working tree, including untracked files
if [[ -n "$(git status --porcelain)" ]]; then
  echo "Error: working tree is not clean — commit or stash changes first" >&2
  exit 1
fi

# Ensure we're on main
branch=$(git branch --show-current)
if [[ "$branch" != "main" ]]; then
  echo "Error: must be on main branch (currently on: $branch)" >&2
  exit 1
fi

# Pull latest
git pull --ff-only

# Check tag doesn't already exist
git fetch --tags
if git show-ref --verify --quiet "refs/tags/v${version}"; then
  echo "Error: tag v${version} already exists" >&2
  exit 1
fi

# Create release branch
git checkout -b "release/v${version}"

# Update workspace version in root Cargo.toml
sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml

# Propagate to all workspace deps, Cargo.lock, npm packages
node scripts/sync-versions.js

# Commit and push
git add -A
git commit -m "Release v${version}"
git push -u origin "release/v${version}"

# Open PR with enqueue label for auto-merge after approval
gh pr create \
  --title "Release v${version}" \
  --body "Release prep for v${version}." \
  --label enqueue
'''
