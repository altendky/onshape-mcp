# Codecov configuration
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Ratchet - fail if coverage drops more than 2% from main
        # Catches accidental loss of code/tests
        threshold: 2%
    patch:
      default:
        # New code must be fully covered or explicitly excluded
        target: 100%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true

# Flags distinguish coverage from different sources
flags:
  rust:
    paths:
      - crates/
    carryforward: true
  npm:
    paths:
      - npm/onshape-mcp/
    carryforward: true

# Components for PR comment breakdown
component_management:
  individual_components:
    - component_id: rust
      name: Rust
      paths:
        - crates/**
    - component_id: npm
      name: npm wrapper
      paths:
        - npm/onshape-mcp/**
