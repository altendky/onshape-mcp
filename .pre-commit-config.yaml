repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/crate-ci/typos
    rev: v1.42.3
    hooks:
      - id: typos

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2

  # TODO: switch back to release tag once the shebang fix is released
  #       https://github.com/lycheeverse/lychee/pull/2002
  - repo: https://github.com/lycheeverse/lychee
    rev: 7bf09ac8f919719d36dfc50be15cb26e553a816c
    hooks:
      - id: lychee
        args: ["--no-progress"]
        types: [markdown]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        args: [-verbose]

  - repo: https://github.com/mpalmer/action-validator
    rev: v0.8.0
    hooks:
      - id: action-validator
        args: [-v]
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$
