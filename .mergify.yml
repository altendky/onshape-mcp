queue_rules:
  - name: default
    branch_protection_injection_mode: merge
    queue_conditions:
      - label = enqueue
      - base = main
      - "#approved-reviews-by >= 1"
    merge_method: merge
    checks_timeout: 90 min
    max_checks_retries: 2

merge_protections:
  - name: Auto-queue approved enqueue PRs
    if:
      - base = main
      - label = enqueue
    success_conditions:
      - "#approved-reviews-by >= 1"

merge_queue:
  max_parallel_checks: 1

pull_request_rules:
  - name: Queue approved enqueue PRs
    conditions:
      - base = main
      - label = enqueue
      - "#approved-reviews-by >= 1"
    actions:
      queue:
        name: default

  - name: Automatically approve Renovate PRs
    conditions:
      - author = altendky-renovate[bot]
    actions:
      review:
        type: APPROVE

  - name: Automatically approve post-release PRs
    conditions:
      - author = altendky-release[bot]
      - head~=post-release/
    actions:
      review:
        type: APPROVE
merge_protections_settings:
  reporting_method: check-runs
