# Spell checker configuration
# See: https://github.com/crate-ci/typos

[default]
# Ignore specific patterns (not global word exceptions)
extend-ignore-re = [
    # alls-green GitHub Action (re-actors/alls-green)
    "alls-green",
]

[files]
# Files to ignore
extend-exclude = [
    # Vendored Onshape OpenAPI spec — contains upstream typos we don't control
    "crates/onshape-mcp-io/onshape-openapi.json",
]
